<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>单元示例1 · 四层竖屏视差预览</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #10172b; color: #fff; font: 14px system-ui, sans-serif; }
    body { display: grid; place-items: center; }
    #stage { position: relative; width: min(100vw, 56.25dvh); height: 100dvh; overflow: hidden; background: #10172b; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    canvas:active { cursor: grabbing; }
    .top { position: absolute; z-index: 1; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; padding: 9px 11px; border-radius: 12px; background: #101b37bb; backdrop-filter: blur(8px); pointer-events: none; line-height: 1.45; }
    .top strong { display: block; font-size: 15px; }
    .top small { color: #d5ddf3; }
    .controls { position: absolute; z-index: 2; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 7px; padding: 9px; border-radius: 14px; background: #101b37dd; backdrop-filter: blur(8px); }
    button, input { touch-action: manipulation; }
    button { border: 1px solid #8595bd; border-radius: 9px; background: #233966; color: white; font: inherit; padding: 8px 11px; min-height: 38px; }
    button:focus-visible, input:focus-visible { outline: 2px solid #ffcc77; }
    #zoom { flex: 1; min-width: 0; accent-color: #ffc879; }
    #readout { min-width: 48px; text-align: right; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main id="stage" aria-label="单元示例1竖屏视差测试">
    <canvas id="scene" aria-label="拖动画面左右移动，双指捏合缩放"></canvas>
    <div class="top"><strong>单元示例1 · 场景视差预览</strong><small>左右拖动 · 双指缩放 · 鼠标滚轮缩放<br>前 → 后：1 : 1 : 0.8 : 0.3</small></div>
    <div class="controls">
      <button id="minus" type="button" aria-label="缩小">−</button>
      <input id="zoom" type="range" min="1" max="1.8" step="0.01" value="1" aria-label="缩放倍率">
      <button id="plus" type="button" aria-label="放大">＋</button>
      <button id="reset" type="button">重置</button>
      <span id="readout">1.00×</span>
    </div>
  </main>
  <script src="preview.js"></script>
</body>
</html>
