<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280" role="img" aria-label="孟桃与玩家一轮演示对话竖屏界面示意">
  <title>孟桃对话｜720×1280 UI 样张</title>
  <desc>对话文字均标为演示，背景和人物形块只用于布局检查，不是正式剧情或生产角色资源。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#102746"/><stop offset="1" stop-color="#31567A"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF2D8"/><stop offset="1" stop-color="#EAD4AC"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#051229" flood-opacity=".62"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif}.ink{fill:#342B2C}.cream{fill:#F8EDDA}.strong{font-weight:700}.muted{fill:#C3D0DD}</style>
  </defs>
  <rect width="720" height="1280" fill="url(#sky)"/>
  <circle cx="553" cy="166" r="61" fill="#F9DEAB" opacity=".16" filter="url(#blur)"/><circle cx="553" cy="166" r="32" fill="#F9DEAB"/>
  <path d="M0 405Q148 254 287 365T532 330T720 365V755H0Z" fill="#1B395B"/>
  <path d="M0 571Q164 468 335 559T720 532V775H0Z" fill="#2C4C69"/>
  <rect x="0" y="646" width="720" height="189" fill="#8C8580"/>
  <path d="M0 665H720M0 734H720" stroke="#B9AA96" stroke-width="6"/>
  <rect x="78" y="432" width="315" height="247" rx="10" fill="#76543A" stroke="#D6B98B" stroke-width="7"/>
  <path d="M48 439l188-130 189 130Z" fill="#1C2D45" stroke="#B6A88B" stroke-width="8"/>
  <rect x="126" y="470" width="226" height="70" fill="#F7E5C2" stroke="#6D432F" stroke-width="6"/>
  <text x="239" y="518" text-anchor="middle" class="ink strong" font-size="32">奶茶店</text>
  <circle cx="500" cy="550" r="66" fill="#86614D"/>
  <path d="M418 665q8-93 81-93 75 0 82 93Z" fill="#729A76" stroke="#D4B07C" stroke-width="5"/>
  <rect x="0" y="0" width="720" height="120" fill="#102A4B" opacity=".96"/>
  <rect x="24" y="43" width="95" height="58" rx="13" fill="#F7E5C2" stroke="#6D432F" stroke-width="3"/>
  <text x="72" y="81" text-anchor="middle" class="ink strong" font-size="22">返回</text>
  <text x="360" y="83" text-anchor="middle" class="cream strong" font-size="31">06 孟桃对话</text>
  <rect x="584" y="43" width="112" height="58" rx="13" fill="#F7E5C2" stroke="#6D432F" stroke-width="3"/>
  <text x="640" y="81" text-anchor="middle" class="ink strong" font-size="22">重置</text>
  <rect x="0" y="120" width="720" height="1160" fill="#091A30" opacity=".28"/>
  <rect x="84" y="183" width="552" height="54" rx="17" fill="#153154" stroke="#94C3D7" stroke-width="2"/>
  <text x="360" y="218" text-anchor="middle" class="cream strong" font-size="20">对话打开时，场景拖拽与缩放暂停</text>
  <!-- speech panel -->
  <rect x="24" y="704" width="672" height="496" rx="25" fill="#6D432F" stroke="#D8AE72" stroke-width="6" filter="url(#shadow)"/>
  <rect x="40" y="722" width="640" height="461" rx="17" fill="url(#paper)"/>
  <rect x="57" y="676" width="247" height="71" rx="13" fill="#F7E5C2" stroke="#6D432F" stroke-width="5"/>
  <circle cx="101" cy="710" r="23" fill="#8E644A"/><path d="M79 728q3-27 22-27 18 0 24 27Z" fill="#729A76"/>
  <text x="144" y="719" class="ink strong" font-size="29">孟桃</text>
  <rect x="427" y="738" width="232" height="42" rx="10" fill="#18375D"/>
  <text x="543" y="766" text-anchor="middle" class="cream strong" font-size="18">演示文案 · 非正式剧情</text>
  <text x="72" y="817" class="ink strong" font-size="23">孟桃</text>
  <text x="72" y="863" class="ink" font-size="26">你好，欢迎来看看奶茶店。</text>
  <path d="M69 898H651" stroke="#BCAB8A" stroke-width="2"/>
  <text x="72" y="941" class="ink strong" font-size="23">玩家 · 演示文案</text>
  <text x="72" y="986" class="ink" font-size="26">好的，我先四处看看。</text>
  <path d="M69 1021H651" stroke="#BCAB8A" stroke-width="2"/>
  <rect x="76" y="1062" width="244" height="76" rx="15" fill="#F7E5C2" stroke="#8F603F" stroke-width="4"/>
  <text x="198" y="1110" text-anchor="middle" class="ink strong" font-size="25">关闭</text>
  <rect x="399" y="1062" width="244" height="76" rx="15" fill="#F6AD55" stroke="#8F603F" stroke-width="4"/>
  <text x="521" y="1110" text-anchor="middle" class="ink strong" font-size="25">继续 / 结束</text>
  <text x="360" y="1234" text-anchor="middle" class="muted" font-size="17">审阅图合并展示两句；运行时逐句继续 · 非生产资源</text>
</svg>
