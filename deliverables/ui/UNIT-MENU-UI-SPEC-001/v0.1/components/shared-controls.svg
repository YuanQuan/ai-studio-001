<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280" role="img" aria-label="七菜单共享身份卡、按钮、方向段选和开关状态图">
  <title>七项菜单｜共享组件与状态 v0.1</title>
  <desc>可编辑 UI 组件示意，正式美术资源需 Art Review 与用户批准。</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#102746"/><stop offset="1" stop-color="#24466C"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFF1D7"/><stop offset="1" stop-color="#E5D0A9"/></linearGradient>
    <style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif}.cream{fill:#F8EDDA}.ink{fill:#342B2C}.muted{fill:#B9CBE0}.strong{font-weight:700}</style>
    <g id="cup"><path d="M-14 -7H14L10 17H-10Z" fill="#F8EDDA" stroke="#6D432F" stroke-width="3"/><path d="M-18 -8H18M2 -9L9 -23" stroke="#6D432F" stroke-width="3" fill="none"/><circle cx="-5" cy="8" r="2" fill="#6D432F"/><circle cx="3" cy="9" r="2" fill="#6D432F"/></g>
  </defs>
  <rect width="720" height="1280" fill="url(#night)"/>
  <text x="38" y="73" class="cream strong" font-size="35">共享组件与状态</text>
  <text x="38" y="107" class="muted" font-size="19">单元 Lab 使用统一母版；主体只取正式共用组件</text>
  <path d="M38 136H682" stroke="#D1A166" stroke-width="3"/>
  <text x="38" y="191" class="cream strong" font-size="26">01  共用身份卡</text>
  <rect x="38" y="213" width="420" height="127" rx="18" fill="url(#paper)" stroke="#6D432F" stroke-width="5"/>
  <g transform="translate(91 274)"><use href="#cup"/></g>
  <text x="132" y="263" class="ink strong" font-size="27">奶茶店</text>
  <text x="132" y="302" class="ink" font-size="21">店长 孟桃</text>
  <text x="486" y="260" class="muted" font-size="18">唯一母版</text>
  <text x="486" y="288" class="muted" font-size="18">Lab / 组合 / 主体</text>
  <text x="486" y="317" class="muted" font-size="18">均引同源</text>
  <path d="M38 375H682" stroke="#5B7797" stroke-width="2"/>
  <text x="38" y="425" class="cream strong" font-size="26">02  Lab 按钮状态</text>
  <g text-anchor="middle" font-size="20" font-weight="700">
    <rect x="38" y="448" width="205" height="79" rx="14" fill="url(#paper)" stroke="#8F603F" stroke-width="4"/><text x="141" y="497" class="ink">开始演示</text>
    <rect x="258" y="454" width="205" height="79" rx="14" fill="#D9873F" stroke="#8F603F" stroke-width="4"/><text x="361" y="503" class="ink">按下</text>
    <rect x="478" y="448" width="205" height="79" rx="14" fill="#D9C8A6" stroke="#857A70" stroke-width="4"/><text x="581" y="497" fill="#6A625F">不可用</text>
    <rect x="38" y="552" width="205" height="79" rx="14" fill="#F7E5C2" stroke="#F6AD55" stroke-width="5"/><text x="141" y="601" class="ink">✓ 已选择</text>
    <rect x="258" y="552" width="205" height="79" rx="14" fill="#E8D8BA" stroke="#8F603F" stroke-width="4"/><text x="361" y="601" class="ink">准备中…</text>
    <rect x="478" y="552" width="205" height="79" rx="14" fill="#F4D7C7" stroke="#A54D4B" stroke-width="4"/><text x="581" y="601" class="ink">资源未就绪</text>
  </g>
  <g class="muted" font-size="16" text-anchor="middle"><text x="141" y="650">normal</text><text x="361" y="650">pressed</text><text x="581" y="650">disabled</text><text x="141" y="674">selected</text><text x="361" y="674">loading</text><text x="581" y="674">error</text></g>
  <path d="M38 708H682" stroke="#5B7797" stroke-width="2"/>
  <text x="38" y="755" class="cream strong" font-size="26">03  左右与五状态段选</text>
  <rect x="38" y="779" width="270" height="72" rx="13" fill="#E6D3B4" stroke="#8F603F" stroke-width="4"/>
  <rect x="42" y="783" width="130" height="64" rx="10" fill="#F6AD55"/>
  <text x="107" y="828" text-anchor="middle" class="ink strong" font-size="24">向左 ✓</text>
  <text x="240" y="828" text-anchor="middle" class="ink strong" font-size="24">向右</text>
  <rect x="336" y="779" width="346" height="72" rx="13" fill="#E6D3B4" stroke="#8F603F" stroke-width="4"/>
  <rect x="341" y="784" width="65" height="62" rx="9" fill="#F6AD55"/>
  <text x="373" y="827" text-anchor="middle" class="ink strong" font-size="16">移动</text>
  <text x="442" y="827" text-anchor="middle" class="ink strong" font-size="16">跑动</text>
  <text x="511" y="827" text-anchor="middle" class="ink strong" font-size="16">高兴</text>
  <text x="580" y="827" text-anchor="middle" class="ink strong" font-size="16">沮丧</text>
  <text x="650" y="827" text-anchor="middle" class="ink strong" font-size="16">坐姿</text>
  <text x="38" y="886" class="muted" font-size="18">方向文字始终正向；幽灵骨骼翻转不翻转 UI</text>
  <path d="M38 923H682" stroke="#5B7797" stroke-width="2"/>
  <text x="38" y="971" class="cream strong" font-size="26">04  对象开关与演示状态</text>
  <rect x="38" y="995" width="202" height="72" rx="13" fill="url(#paper)" stroke="#F6AD55" stroke-width="4"/>
  <text x="70" y="1041" class="ink strong" font-size="21">灯笼</text><rect x="161" y="1011" width="58" height="39" rx="19" fill="#729A76"/><circle cx="199" cy="1030" r="15" fill="#F8EDDA"/>
  <rect x="256" y="995" width="202" height="72" rx="13" fill="url(#paper)" stroke="#8F603F" stroke-width="4"/>
  <text x="288" y="1041" class="ink strong" font-size="21">花草</text><rect x="379" y="1011" width="58" height="39" rx="19" fill="#8B8580"/><circle cx="397" cy="1030" r="15" fill="#F8EDDA"/>
  <rect x="478" y="995" width="204" height="72" rx="13" fill="#18375D" stroke="#94C3D7" stroke-width="3"/>
  <text x="580" y="1040" text-anchor="middle" class="cream strong" font-size="20">演示 · 待机</text>
  <text x="38" y="1108" class="muted" font-size="18">开关 off/on 有文字与形态；光影随对象隐藏而退出</text>
  <rect x="38" y="1154" width="644" height="70" rx="13" fill="#143356" stroke="#56728E" stroke-width="2"/>
  <text x="360" y="1196" text-anchor="middle" class="cream" font-size="18">字体与图形尚待生产授权、Art 视觉复核及实机验证</text>
</svg>
