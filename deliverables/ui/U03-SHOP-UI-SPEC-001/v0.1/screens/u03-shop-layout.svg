<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280" role="img" aria-label="U03 单店展示页结构审阅示意；并非正式游戏资源">
  <title>U03 单店展示页结构示意，720×1280 候选画布</title>
  <desc>仅说明安全区、单店视窗、当前店身份和前后切换控件的位置。中央虚线框不是店铺图，颜色与字形不是正式资源。</desc>
  <rect width="720" height="1280" fill="#0D2343"/>
  <rect x="24" y="24" width="672" height="1232" rx="18" fill="none" stroke="#94C3D7" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="360" y="43" fill="#94C3D7" font-family="sans-serif" font-size="18" text-anchor="middle">设备安全区候选 · 实机复核</text>
  <rect x="44" y="62" width="160" height="78" rx="12" fill="#F7E5C2"/>
  <text x="124" y="110" fill="#342B2C" font-family="sans-serif" font-size="24" text-anchor="middle">返回菜单</text>
  <text x="470" y="110" fill="#F8EDDA" font-family="sans-serif" font-size="32" text-anchor="middle">U03 店铺示例</text>
  <rect x="44" y="170" width="632" height="830" rx="20" fill="#18375D" stroke="#94C3D7" stroke-width="3"/>
  <rect x="68" y="194" width="584" height="782" rx="8" fill="none" stroke="#F6AD55" stroke-width="2" stroke-dasharray="12 10"/>
  <text x="360" y="470" fill="#F8EDDA" font-family="sans-serif" font-size="30" text-anchor="middle">仅放一间获批的完整店铺</text>
  <text x="360" y="520" fill="#94C3D7" font-family="sans-serif" font-size="22" text-anchor="middle">店体与该店牌匾同源、等比完整显示</text>
  <text x="360" y="565" fill="#94C3D7" font-family="sans-serif" font-size="20" text-anchor="middle">虚线仅示内部安全边，不是正式底图</text>
  <line x1="68" y1="910" x2="652" y2="910" stroke="#94C3D7" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="360" y="946" fill="#94C3D7" font-family="sans-serif" font-size="18" text-anchor="middle">六店同一地线候选</text>
  <rect x="174" y="1024" width="372" height="64" rx="12" fill="#18375D" stroke="#F6AD55" stroke-width="2"/>
  <text x="360" y="1066" fill="#F8EDDA" font-family="sans-serif" font-size="27" text-anchor="middle">01/06 奶茶店</text>
  <rect x="62" y="1110" width="238" height="88" rx="14" fill="#F7E5C2"/>
  <text x="181" y="1166" fill="#342B2C" font-family="sans-serif" font-size="28" text-anchor="middle">← 上一店</text>
  <rect x="420" y="1110" width="238" height="88" rx="14" fill="#F7E5C2"/>
  <text x="539" y="1166" fill="#342B2C" font-family="sans-serif" font-size="28" text-anchor="middle">下一店 →</text>
  <text x="360" y="1233" fill="#94C3D7" font-family="sans-serif" font-size="19" text-anchor="middle">两端循环 · 任何时候只有一个当前店</text>
  <rect x="0" y="0" width="720" height="24" fill="#A54D4B"/>
  <text x="360" y="18" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">UI 规格审阅示意 · 非正式图片 / 字体 / 运行切片</text>
</svg>
