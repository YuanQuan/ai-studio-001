<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="780" viewBox="0 0 1080 780" role="img" aria-label="U03 前后切换控件与状态审阅示意；并非正式游戏资源">
  <title>U03 切换控件状态示意</title>
  <desc>正常、按下、切换中、禁用、运行错误和返回复位的文字及结构示意。颜色和字体尚未成为正式资产。</desc>
  <rect width="1080" height="780" fill="#0D2343"/>
  <rect width="1080" height="34" fill="#A54D4B"/>
  <text x="540" y="24" fill="#fff" font-family="sans-serif" font-size="19" font-weight="bold" text-anchor="middle">UI 规格审阅示意 · 非正式图片 / 字体 / 运行切片</text>
  <text x="50" y="88" fill="#F8EDDA" font-family="sans-serif" font-size="29">同一组件：上一店 / 下一店</text>
  <text x="50" y="122" fill="#94C3D7" font-family="sans-serif" font-size="19">候选命中区 ≥96×88 设计单位；图中外观框不代表命中区，均须实测</text>
  <text x="60" y="180" fill="#F8EDDA" font-family="sans-serif" font-size="23">正常</text>
  <rect x="200" y="144" width="280" height="70" rx="12" fill="#F7E5C2" stroke="#6D432F" stroke-width="3"/>
  <text x="340" y="188" fill="#342B2C" font-family="sans-serif" font-size="25" text-anchor="middle">← 上一店</text>
  <text x="570" y="180" fill="#F8EDDA" font-family="sans-serif" font-size="23">01 前一店到 06</text>
  <text x="60" y="275" fill="#F8EDDA" font-family="sans-serif" font-size="23">按下</text>
  <rect x="200" y="246" width="280" height="70" rx="12" fill="#D9873F" stroke="#F7E5C2" stroke-width="4"/>
  <text x="340" y="291" fill="#342B2C" font-family="sans-serif" font-size="25" text-anchor="middle">下一店 →</text>
  <text x="570" y="275" fill="#F8EDDA" font-family="sans-serif" font-size="23">下沉与边框共同反馈</text>
  <text x="60" y="370" fill="#F8EDDA" font-family="sans-serif" font-size="23">切换中</text>
  <rect x="200" y="340" width="280" height="70" rx="12" fill="#F7E5C2" stroke="#94C3D7" stroke-width="4"/>
  <text x="340" y="385" fill="#342B2C" font-family="sans-serif" font-size="25" text-anchor="middle">下一店 →</text>
  <text x="570" y="360" fill="#94C3D7" font-family="sans-serif" font-size="21">仍显示 01 奶茶店</text>
  <text x="570" y="391" fill="#94C3D7" font-family="sans-serif" font-size="21">正在切换至 02 糖画摊</text>
  <text x="60" y="465" fill="#F8EDDA" font-family="sans-serif" font-size="23">禁用</text>
  <rect x="200" y="435" width="280" height="70" rx="12" fill="#D9C8A6" stroke="#94C3D7" stroke-width="3"/>
  <text x="340" y="479" fill="#342B2C" font-family="sans-serif" font-size="25" text-anchor="middle">下一店 →</text>
  <text x="570" y="465" fill="#F8EDDA" font-family="sans-serif" font-size="23">资源未就绪 · 不响应</text>
  <text x="60" y="560" fill="#F8EDDA" font-family="sans-serif" font-size="23">错误</text>
  <rect x="200" y="530" width="280" height="70" rx="12" fill="#18375D" stroke="#A54D4B" stroke-width="4"/>
  <text x="340" y="575" fill="#F8EDDA" font-family="sans-serif" font-size="25" text-anchor="middle">重试</text>
  <text x="570" y="547" fill="#F8EDDA" font-family="sans-serif" font-size="20">02 糖画摊暂不可用</text>
  <text x="570" y="579" fill="#F8EDDA" font-family="sans-serif" font-size="20">仍显示 01 奶茶店</text>
  <line x1="48" y1="635" x2="1032" y2="635" stroke="#94C3D7" stroke-width="2"/>
  <text x="60" y="680" fill="#F8EDDA" font-family="sans-serif" font-size="23">返回菜单</text>
  <text x="265" y="680" fill="#94C3D7" font-family="sans-serif" font-size="21">取消待切换；再次进入复位 01 奶茶店</text>
  <text x="60" y="732" fill="#94C3D7" font-family="sans-serif" font-size="19">所有名称、索引、店图与牌匾以同一个已呈现店为准；此图不包含任何真实店图。</text>
</svg>
